server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Хешированные бандлы Vite: кэш на год; отсутствующий файл — честный 404,
    # иначе браузер получит index.html и попытается выполнить его как JS.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html не кэшируем — пользователь сразу видит новую версию после деплоя
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: любой другой путь (/login, /requests/42, ...) отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}