services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8079:8080"
    volumes:
      - .:/app                    # монтируем код
      - /app/node_modules         # НЕ перекрываем node_modules из образа
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true  # для надёжного hot-reload в Docker (особенно macOS/Windows)
      - WATCHPACK_POLLING=true    # если используется webpack
    command: npm run dev -- --host 0.0.0.0
    stdin_open: true
    tty: true