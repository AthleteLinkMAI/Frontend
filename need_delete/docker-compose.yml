# docker-compose for backend

name: athletelink-backend

services:
  api-gateway:
    image: kekishev/athlete-link-api-gateway:latest
    ports:
      - "127.0.0.1:${GATEWAY_HTTP_HOST_PORT:-8080}:8080"
    environment:
      GATEWAY_HTTP_ADDR: :8080
      GATEWAY_CORE_URL: http://core-service:8082
      GATEWAY_AUTH_URL: http://auth-service:8081
      GATEWAY_GAME_URL: http://game-service:8084
      GATEWAY_CORE_HEALTH_URL: http://core-service:8082/v3/api-docs
      GATEWAY_AUTH_HEALTH_URL: http://auth-service:8081/health
      GATEWAY_GAME_HEALTH_URL: http://game-service:8084/api/v1/v3/api-docs
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:-admin}
      JWT_SECRET: ${JWT_SECRET:-secret}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - backend

  auth-service:
    image: kekishev/athlete-link-auth-service:latest
    ports:
      - "127.0.0.1:${AUTH_SERVICE_HOST_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-admin}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${AUTH_REDIS_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET: ${JWT_SECRET:-secret}
    depends_on:
      auth-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - auth-logs:/logs
    networks:
      - backend

  core-service:
    image: kekishev/athlete-link-core-service:latest
    ports:
      - "127.0.0.1:${CORE_SERVICE_HOST_PORT:-8082}:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/core_db
      SPRING_DATASOURCE_USERNAME: ${CORE_DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${CORE_DB_PASSWORD:-admin}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    depends_on:
      core-db:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - backend

  game-service:
    image: kekishev/athlete-link-game-service:latest
    ports:
      - "127.0.0.1:${GAME_SERVICE_HOST_PORT:-8084}:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://game-db:5432/game_db
      DB_USER: ${GAME_DB_USER:-postgres}
      DB_PASSWORD: ${GAME_DB_PASSWORD:-admin}
    depends_on:
      game-db:
        condition: service_healthy
    networks:
      - backend

  notification-service:
    image: kekishev/athlete-link-notification-service:latest
    ports:
      - "127.0.0.1:${NOTIFICATION_SERVICE_HOST_PORT:-8085}:8085"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      EMAIL_ADDRESS: ${EMAIL_ADDRESS:-admin}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD:-admin}
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-admin}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - notification-logs:/logs/athletelink
    networks:
      - backend

  auth-db:
    image: postgres:15
    ports:
      - "127.0.0.1:${AUTH_DB_HOST_PORT:-1234}:5432"
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  redis:
    image: redis:8-alpine
    environment:
      REDISCLI_AUTH: ${AUTH_REDIS_PASSWORD:-admin}
    command: ["redis-server", "--requirepass", "${AUTH_REDIS_PASSWORD:-admin}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - auth-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q '^PONG$'"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - backend

  kafka-init:
    image: apache/kafka:4.1.2
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic user.changes --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic notification.messages.requested --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --create --if-not-exists --topic activity.requests --partitions 3 --replication-factor 1
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  game-db:
    image: postgres:17
    environment:
      POSTGRES_DB: game_db
      POSTGRES_USER: ${GAME_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${GAME_DB_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - game-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  core-db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: core_db
      POSTGRES_USER: ${CORE_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-admin}
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

networks:
  backend:

volumes:
  auth-db-data:
  auth-logs:
  auth-redis-data:
  kafka-data:
  game-db-data:
  core-db-data:
  notification-logs:
